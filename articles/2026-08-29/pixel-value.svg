<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="1600" height="900" fill="#10121b"/><text x="100" y="145" fill="#b7ff2a" font-family="Arial" font-size="50" font-weight="900">¿QUÉ COMPRA EL PRECIO PREMIUM?</text><g font-family="Arial" font-size="42" font-weight="800"><rect x="100" y="250" width="420" height="360" fill="#7337ff"/><text x="175" y="390" fill="white">CÁMARA</text><text x="175" y="455" fill="white">+ IA</text><rect x="590" y="250" width="420" height="360" fill="#b7ff2a"/><text x="665" y="390" fill="#111">SOPORTE</text><text x="665" y="455" fill="#111">+ SEGURIDAD</text><rect x="1080" y="250" width="420" height="360" fill="#ff6b2c"/><text x="1155" y="390" fill="#111">BATERÍA</text><text x="1155" y="455" fill="#111">A PROBAR</text></g><text x="100" y="750" fill="#cbd0df" font-family="Arial" font-size="35">El valor depende del uso real, el idioma y la región.</text></svg>
